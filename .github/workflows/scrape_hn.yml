name: job_scraper 
on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{secrets.DATABASE_URL}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Scrape HN
        run: python hn_scraper.py